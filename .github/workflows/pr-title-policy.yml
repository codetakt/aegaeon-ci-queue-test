name: Pull request title validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: PR title policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the protected title policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codetakt/aegaeon
          ref: fb3bca09bca97789f6e72505e09810036586aadb
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-ci
      - name: Evaluate current PR titles
        env:
          GH_TOKEN: ${{ github.token }}
          # Pin the selector separately so the first PR can run before the
          # selector exists on main. The commitlint policy comes from the base.
          SELECTOR_REVISION: 9f30a0592804ff6afc6037397b6eff7097803883
        run: |
          selector="$RUNNER_TEMP/check_pr_titles.py"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/codetakt/aegaeon/contents/scripts/ci/check_pr_titles.py?ref=$SELECTOR_REVISION" > "$selector"
          echo "Title policy revision: $(git rev-parse HEAD)"
          nix shell --inputs-from . nixpkgs#commitlint --command python3 -I "$selector"
